x-app-env: &app-env
  NODE_ENV: production
  DB_HOST: neo4j
  DB_PORT: "7687"
  DB_URI: bolt://neo4j:7687
  DB_USER: neo4j
  DB_PASSWORD: vyra-ai@2025
  DB_NAME: agentic-grc
  API_PORT: "4001"

services:
  neo4j:
    image: neo4j:5-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: eval
      NEO4J_AUTH: neo4j/vyra-ai@2025
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p vyra-ai@2025 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  ingest:
    build:
      context: .
    image: vyra-app
    command: ["ingest"]
    environment: *app-env
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    image: vyra-app
    command: ["api"]
    environment: *app-env
    ports:
      - "4001:4001"
    depends_on:
      ingest:
        condition: service_completed_successfully

  ui:
    image: vyra-app
    command: ["ui"]
    ports:
      - "3002:3002"
    depends_on:
      - api

volumes:
  neo4j-data:
