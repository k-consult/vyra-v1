        <!-- UI -> API -->
        <path d="M450,116 V160" fill="none" stroke="#5B6472" stroke-width="1.2" marker-end="url(#lArrow)"/>
        <rect x="432" y="146" width="36" height="12" rx="2" fill="#F7F8FB"/>
        <text x="450" y="155" fill="#5B6472" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

        <!-- FEED -> CLI (hop over UI->API; exits FEED's top-right so it clears the INTEGRATION EDGE zone label) -->
        <path d="M230,160 V146 Q230,138 238,138 H442 a8,8 0 0,1 16,0 H642 Q650,138 650,146 V160"
