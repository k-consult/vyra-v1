<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img" aria-labelledby="layers-title layers-desc">
        <title id="layers-title">Vyra layered architecture, faithful detail</title>
        <desc id="layers-desc">Full component diagram of one Vyra tenant deployment: the UI presentation edge; an integration edge of IoT signals, CSV feeds, and third-party APIs; an application zone of the API service, ingestion pipeline, agent runtime, and the shared graph-db gateway; a data zone of the Neo4j twin and a planned audit log; and an external-services zone of the live local Ollama model plus planned SSO and notifications, with five applied patterns and three known-debt items tagged at their real location.</desc>
        <defs>
          <marker id="lArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#5B6472"/>
          </marker>
          <marker id="lArrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#8F6A22"/>
          </marker>
          <marker id="lArrowFaint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#98A0AF"/>
          </marker>
        </defs>

        <!-- ===== zones (bg -> zones -> arrows -> nodes) ===== -->
        <rect x="40" y="128" width="240" height="304" rx="8" fill="#3A3F49" opacity="0.035" stroke="#D7DBE4" stroke-width="0.8"/>
        <rect x="52" y="132" width="150" height="14" rx="2" fill="#F7F8FB"/>
        <text x="60" y="142" fill="#5B6472" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.1em">INTEGRATION EDGE</text>

        <rect x="340" y="128" width="620" height="216" rx="8" fill="#3A3F49" opacity="0.035" stroke="#D7DBE4" stroke-width="0.8"/>
        <rect x="700" y="132" width="180" height="14" rx="2" fill="#F7F8FB"/>
        <text x="708" y="142" fill="#5B6472" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.1em">APPLICATION LAYERS</text>

        <rect x="510" y="332" width="440" height="128" rx="8" fill="#3A3F49" opacity="0.035" stroke="#D7DBE4" stroke-width="0.8"/>
        <rect x="522" y="336" width="56" height="14" rx="2" fill="#F7F8FB"/>
        <text x="530" y="346" fill="#5B6472" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.1em">DATA</text>

        <rect x="1000" y="128" width="240" height="304" rx="8" fill="#3A3F49" opacity="0.035" stroke="#D7DBE4" stroke-width="0.8"/>
        <rect x="1012" y="132" width="168" height="14" rx="2" fill="#F7F8FB"/>
        <text x="1020" y="142" fill="#5B6472" font-size="8" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.1em">EXTERNAL SERVICES</text>

