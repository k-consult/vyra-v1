        <path d="M650,236 V260" fill="none" stroke="#5B6472" stroke-width="1.2" marker-end="url(#lArrow)"/>
        <!-- AG -> LIB -->
        <path d="M850,236 V240 Q850,248 842,248 H803 Q795,248 795,256 V260"
              fill="none" stroke="#5B6472" stroke-width="1.2" marker-end="url(#lArrow)"/>

