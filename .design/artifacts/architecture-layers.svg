        <rect x="64" y="352" width="192" height="56" rx="6" fill="#F7F8FB"/>
        <rect x="64" y="352" width="192" height="56" rx="6" fill="#FFFFFF" stroke="#D7DBE4" stroke-width="1.2"/>
        <text x="160" y="376" fill="#171A21" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">Integration API</text>
        <text x="160" y="392" fill="#5B6472" font-size="9" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">3rd-party systems</text>

