<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bcmap-title bcmap-desc">
      <title id="bcmap-title">Vyra Bounded Context Map</title>
      <desc id="bcmap-desc">Architecture diagram showing the Tenant Compliance Twin bounded context, one per enterprise, receiving a live catalog sync from Vyra Central's Master Catalog Distribution sub-boundary, with target pattern feed-down and harvest to Collective Intelligence, and target tenant resolution from Tenancy and Entitlement.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: Vyra Central -->
      <rect x="40" y="48" width="920" height="120" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="96" y="52" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="140" y="61" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VYRA CENTRAL</text>

      <!-- Arrows (behind boxes) -->
      <!-- Master Catalog Distribution -> Twin : solid, live -->
      <line x1="240" y1="152" x2="240" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Collective Intelligence -> Twin : dashed, target (feed-down) -->
      <path d="M 484,152 V 264" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Twin -> Collective Intelligence : dashed, target (harvest) -->
      <path d="M 516,264 V 152" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Tenancy & Entitlement -> Twin : dashed, target (tenant resolution) -->
      <line x1="760" y1="152" x2="760" y2="264" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="196" y="196" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CATALOG SYNC</text>

      <rect x="408" y="200" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="442" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FEED-DOWN</text>

      <rect x="524" y="200" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HARVEST</text>

      <rect x="700" y="196" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="756" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVE TENANT</text>

      <!-- Node: Master Catalog Distribution -->
      <rect x="128" y="88" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="88" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="136" y="96" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="150" y="105" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
      <text x="240" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Master Catalog Distribution</text>
      <text x="240" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sub-boundary · partial (same-DB)</text>

      <!-- Node: Collective Intelligence -->
      <rect x="388" y="88" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="388" y="88" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="396" y="96" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="408" y="105" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CI</text>
      <text x="500" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Collective Intelligence</text>
      <text x="500" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sub-boundary · target</text>

      <!-- Node: Tenancy & Entitlement -->
      <rect x="648" y="88" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="88" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="656" y="96" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="670" y="105" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENT</text>
      <text x="760" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tenancy &amp; Entitlement</text>
      <text x="760" y="138" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sub-boundary · target</text>

      <!-- Node: Tenant Compliance Twin (focal) -->
      <rect x="128" y="264" width="744" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="264" width="744" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="136" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="150" y="281" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BC1</text>
      <text x="500" y="288" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">«BOUNDED CONTEXT» · ONE PER ENTERPRISE</text>
      <text x="500" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tenant Compliance Twin</text>
      <text x="500" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Knowledge · Operational · Execution · Intelligence · Assurance · Onboarding</text>

      <!-- Legend -->
      <line x1="40" y1="384" x2="960" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="416" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal · this document's subject</text>

      <line x1="260" y1="421" x2="288" y2="421" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="296" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Live / partial relationship</text>

      <line x1="500" y1="421" x2="528" y2="421" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="536" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Target · not yet built</text>

      <rect x="720" y="416" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="740" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Zone · sub-boundary grouping</text>
    </svg>
